name: test-groq-key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Groq chat calls with the stored secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.error
          key = __import__('os').environ['GROQ_API_KEY']
          def call(label, body):
              req = urllib.request.Request(
                  'https://api.groq.com/openai/v1/chat/completions',
                  data=json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode())
                      print(label, 'HTTP', r.status, 'content:', str(d['choices'][0]['message']['content'])[:100])
              except urllib.error.HTTPError as e:
                  print(label, 'HTTP', e.code, 'error:', e.read().decode()[:300])
              except Exception as e:
                  print(label, 'ERROR', type(e).__name__, str(e)[:200])
          call('A-gptoss-exact-mapper-call', {'model': 'openai/gpt-oss-20b', 'temperature': 0, 'max_tokens': 5, 'reasoning_effort': 'low', 'messages': [{'role': 'user', 'content': 'Reply with the word ok.'}]})
          call('B-gptoss-no-reasoning-temp1', {'model': 'openai/gpt-oss-20b', 'temperature': 1, 'max_tokens': 5, 'messages': [{'role': 'user', 'content': 'Reply with the word ok.'}]})
          call('C-qwen-temp0', {'model': 'qwen/qwen3.8-27b', 'temperature': 0, 'max_tokens': 5, 'messages': [{'role': 'user', 'content': 'Reply with the word ok.'}]})
          EOF
