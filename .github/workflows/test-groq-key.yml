name: test-groq-key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Groq models list with the stored secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Calling Groq models endpoint (key never printed)..."
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY")
          echo "HTTP status: $code"
          if [ "$code" = "200" ]; then
            python3 -c "import json; d=json.load(open('/tmp/models.json')); print('models:', [m['id'] for m in d.get('data', [])][:10])"
          else
            head -c 500 /tmp/models.json; echo
          fi
