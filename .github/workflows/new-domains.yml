name: new-domains-ct
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Max new domains to add to Directory this run'
        default: '100'
      lookback_hours:
        description: 'Only certs with not_before inside this window'
        default: '48'
concurrency:
  group: new-domains-ct
  cancel-in-progress: false
jobs:
  new-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sheet packages
        run: pip install google-api-python-client google-auth websocket-client
      - name: Scan Certificate Transparency for newly live domains
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/new_domains_ct.py --max-new "${{ inputs.max_new || '100' }}" --lookback-hours "${{ inputs.lookback_hours || '48' }}" --certstream-minutes 3
      - name: Log count only, never lead names (public repo logs are public)
        run: echo "new-domains tick done, lead data lives in Google Sheet only, not in repo"
