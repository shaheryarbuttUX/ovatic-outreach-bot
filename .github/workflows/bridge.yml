name: bridge-directory-to-queue
on:
  schedule:
    - cron: '*/30 * * * *'→ Runs every 30 minutes

  workflow_dispatch:

concurrency:
  group: bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sheet packages
        run: pip install google-api-python-client google-auth
      - name: Pull Directory businesses into Queue, form and CAPTCHA checked
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/bridge.py --max-new 60
      - name: Log count only, never lead names (public repo logs are public)
        run: echo "bridge tick done, lead data lives in Google Sheet only, not in repo"
