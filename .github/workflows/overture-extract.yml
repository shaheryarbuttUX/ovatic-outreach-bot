name: overture-extract
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Overture release, e.g. 2026-10-21.0 (empty = latest from STAC)'
        default: ''
      max_new:
        description: 'Max Directory rows this shard appends'
        default: '5000'
      dry_run:
        description: 'Dry run: dedupe against the Sheet but append nothing (true/false)'
        default: 'false'

permissions:
  contents: read

jobs:
  overture:
    concurrency:
      group: overture-extract-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB and Sheet packages
        run: pip install duckdb==2.0.0 google-api-python-client google-auth
      - name: Extract agency fuel from Overture Maps places
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python scripts/overture_extract.py --release "${{ inputs.release || '' }}" --max-new "${{ inputs.max_new || '5000' }}" --shard ${{ matrix.shard }} --shards 6 $DRY
      - name: Log count only, never lead names (public repo logs are public)
        run: echo "overture tick done, lead data lives in Google Sheet only, not in repo"
