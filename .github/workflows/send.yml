name: send-forms
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: send-forms
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and Sheet packages
        run: pip install playwright google-api-python-client google-auth && python -m playwright install chromium
      - name: Tick every 10 min, send only when guards pass (see script)
        env:
          DRY_RUN: 'false'
          SCREENSHOTS: 'true'
          SCREENSHOT_DIR: 'screenshots'
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/send_form.py --max-send 40
      - name: Upload before/after screenshots for audit (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
      - name: Log count only, never lead names (public repo logs are public)
        run: echo "send tick done, lead data lives in Google Sheet only, not in repo"
